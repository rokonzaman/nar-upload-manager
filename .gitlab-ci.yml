stages:
  - build_push
  - deploy

variables:
  CI_REGISTRY_URL: docker.pstag.de
  BACKEND_IMAGE: $CI_REGISTRY_URL/it-ops/images/nar-manager-backend
  FRONTEND_IMAGE: $CI_REGISTRY_URL/it-ops/images/nar-manager-frontend
  DOCKER_BUILDKIT: 1

# =====================================================================
# BUILD — BACKEND
# =====================================================================
build_push_backend:
  stage: build_push
  image: docker:24.0.5-cli
  tags:
    - docker
  script:
    - set -x
    - set -e

    - echo "$DOCKER_REGISTRY_TOKEN" | docker login -u "$DOCKER_REGISTRY_USER" --password-stdin $CI_REGISTRY_URL

    - |
      echo "===== TAG ====="
      BACKEND_TAG="$CI_COMMIT_TAG"

      : "${BACKEND_TAG:?BACKEND_TAG is empty}"
      echo "Backend image tag: ${BACKEND_TAG}"

      if docker pull "${BACKEND_IMAGE}:${BACKEND_TAG}" 2>/dev/null; then
        echo "Tag exists, skipping backend build."
      else
        echo "Tag does not exist, building..."
        docker build -f backend/Dockerfile -t "${BACKEND_IMAGE}:${BACKEND_TAG}" backend/
        docker push "${BACKEND_IMAGE}:${BACKEND_TAG}"
      fi

      echo "BACKEND_TAG=${BACKEND_TAG}" > build_metadata.env

  artifacts:
    reports:
      dotenv: build_metadata.env
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always

# =====================================================================
# BUILD — FRONTEND
# =====================================================================
build_push_frontend:
  stage: build_push
  image: docker:24.0.5-cli
  tags:
    - docker
  script:
    - set -x
    - set -e

    - echo "$DOCKER_REGISTRY_TOKEN" | docker login -u "$DOCKER_REGISTRY_USER" --password-stdin $CI_REGISTRY_URL

    - |
      echo "===== TAG ====="
      FRONTEND_TAG="$CI_COMMIT_TAG"

      : "${FRONTEND_TAG:?FRONTEND_TAG is empty}"
      echo "Frontend image tag: ${FRONTEND_TAG}"

      if docker pull "${FRONTEND_IMAGE}:${FRONTEND_TAG}" 2>/dev/null; then
        echo "Tag exists, skipping frontend build."
      else
        echo "Tag does not exist, building..."
        docker build -f frontend/Dockerfile -t "${FRONTEND_IMAGE}:${FRONTEND_TAG}" frontend/
        docker push "${FRONTEND_IMAGE}:${FRONTEND_TAG}"
      fi

      echo "FRONTEND_TAG=${FRONTEND_TAG}" >> build_metadata.env

  artifacts:
    reports:
      dotenv: build_metadata.env
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always

# =====================================================================
# DEPLOY
# =====================================================================
.deploy_template:
  image: alpine:latest
  stage: deploy
  tags:
    - docker
  needs:
    - build_push_backend
    - build_push_frontend
  script:
    - apk add --no-cache curl jq
    - |
      echo "===== DEPLOY ====="
      echo "Backend  tag: $BACKEND_TAG"
      echo "Frontend tag: $FRONTEND_TAG"
      echo "Target: $DEPLOY_TARGETS"

      if [ -z "$NETBOX_CONFIG_CONTEXT_ID" ] || [ "$NETBOX_CONFIG_CONTEXT_ID" = "" ]; then
        echo "SKIP: NETBOX_CONFIG_CONTEXT_ID not set"
        exit 0
      fi

      NETBOX_DOMAIN=$(echo $NETBOX_URL | awk -F[/:] '{print $4}')

      echo "Fetching NetBox config context $NETBOX_CONFIG_CONTEXT_ID..."
      CURRENT_CONTEXT=$(curl -s --resolve "$NETBOX_DOMAIN:443:192.168.32.10" \
        -H "Authorization: Token $NETBOX_TOKEN" \
        "$NETBOX_URL/api/extras/config-contexts/$NETBOX_CONFIG_CONTEXT_ID/")

      EXISTING_DATA=$(echo "$CURRENT_CONTEXT" | jq -c '.data // {}')
      UPDATED_DATA=$(echo "$EXISTING_DATA" | jq -c \
        --arg backend "$BACKEND_TAG" \
        --arg frontend "$FRONTEND_TAG" \
        '.deploy_nar_manager_backend_image_version = $backend
         | .deploy_nar_manager_frontend_image_version = $frontend')

      echo "Patching NetBox..."
      curl -s -f -X PATCH \
        --resolve "$NETBOX_DOMAIN:443:192.168.32.10" \
        -H "Authorization: Token $NETBOX_TOKEN" \
        -H "Content-Type: application/json" \
        "$NETBOX_URL/api/extras/config-contexts/$NETBOX_CONFIG_CONTEXT_ID/" \
        -d "{\"data\": $UPDATED_DATA}"

      echo "Done."


deploy_prod:
  extends: .deploy_template
  variables:
    NETBOX_CONFIG_CONTEXT_ID: "100"
    DEPLOY_TARGETS: "pv-nifi-nar-01"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
